    <script>
      (function () {
        // Intercept console.error and console.warn for harmless Vite HMR WebSocket errors
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args
            .map(function (a) {
              return a instanceof Error ? a.message + ' ' + (a.stack || '') : String(a);
            })
            .join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('[vite]') !== -1 && msg.indexOf('WebSocket') !== -1) ||
            (msg.indexOf('WebSocket') !== -1 && (msg.indexOf('closed') !== -1 || msg.indexOf('failed') !== -1))
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args
            .map(function (a) {
              return a instanceof Error ? a.message : String(a);
            })
            .join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('[vite]') !== -1 && msg.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('ws://') !== -1 ||
              msg.indexOf('wss://') !== -1 ||
              msg.indexOf('[vite]') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = (event && event.reason && (event.reason.message || String(event.reason))) || '';
            if (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('ws://') !== -1 ||
              reason.indexOf('wss://') !== -1 ||
              reason.indexOf('[vite]') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          },
          true
        );
      })();
    </script>
